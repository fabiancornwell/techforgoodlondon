<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech for Good London</title>
  <meta name="description" content="Product and engineering jobs at London tech-for-good companies.">
  <style>
    :root {
      --bg: #fafaf7; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
      --line: #e4e4de; --accent: #1f7a4d; --chip: #eef5f0;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151614; --card: #1e201d; --text: #ecece6; --muted: #a0a09a; --line: #30322e; --accent: #5cc58d; --chip: #23302a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
    header h1 { margin: 0 0 4px; font-size: 1.8rem; }
    header p { margin: 0; color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0 8px; align-items: end; }
    .filters label { display: flex; flex-direction: column; font-size: .8rem; color: var(--muted); gap: 4px; }
    select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); min-width: 200px; }
    button { min-width: 0; cursor: pointer; }
    .count { color: var(--muted); font-size: .9rem; margin: 12px 0 16px; }
    .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; }
    .job-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .job h2 { margin: 0; font-size: 1.1rem; }
    .company { font-weight: 600; color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .78rem; }
    .apply { align-self: start; text-decoration: none; background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: .9rem; white-space: nowrap; }
    details { margin-top: 12px; font-size: .92rem; }
    summary { cursor: pointer; color: var(--muted); }
    details p { margin: 8px 0 0; }
    .empty { color: var(--muted); padding: 24px 0; }
    footer { margin-top: 48px; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Tech for Good London</h1>
      <p>Product and engineering roles at London companies doing good.</p>
    </header>

    <div class="filters">
      <label>Seniority
        <select id="f-seniority"><option value="">All levels</option></select>
      </label>
      <label>Office location
        <select id="f-location"><option value="">All locations</option></select>
      </label>
      <button id="f-reset" type="button">Clear</button>
    </div>

    <div class="count" id="count"></div>
    <main id="jobs"></main>

    <footer>Listings are currently sample data.</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
